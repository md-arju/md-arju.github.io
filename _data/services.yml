items:
- title: YouTube Channel Audit
  best_for: Creators who need a clear starting point
  description: A focused review of your channel, recent videos, packaging and available
    analytics to identify the most useful next improvements.
  deliverables:
  - Channel and recent-video review
  - Title and thumbnail observations
  - Prioritized action plan
  details: Channel review · Priority issues · Action plan
  timeline: Scope and delivery date are agreed before work begins.
- title: Video SEO & Packaging
  best_for: Creators preparing a new upload or improving an existing video
  description: Research and packaging support that connects the topic, title,
    thumbnail direction, description and upload setup.
  deliverables:
  - Topic and keyword research
  - Title options and thumbnail direction
  - Description and upload optimization
  details: Research · Title · Thumbnail · Publishing
  timeline: Timing depends on the number of videos and the available project details.
- title: Content Strategy & Growth Support
  best_for: Channels that need ongoing direction and review
  description: Practical support for choosing topics, studying competitors, planning
    content and using channel results to decide what to test next.
  deliverables:
  - Competitor and audience research
  - Content priorities and topic planning
  - Analytics review and next-step guidance
  details: Research · Planning · Analytics · Guidance
  timeline: The working schedule is agreed around the channel's needs.
